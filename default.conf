# Reverse proxy and load balancer.
# /api/ is spread across two backend containers (round robin). Static frontend is served directly.

upstream campus_backend {
    server backend1:5000 max_fails=2 fail_timeout=5s;
    server backend2:5000 max_fails=2 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 64k;

    # Reveals which upstream served the request (useful evidence for load-balancing tests).
    add_header X-Upstream $upstream_addr always;

    location /api/ {
        proxy_pass http://campus_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
        # If one backend is restarting, retry the other. Safe for POST only because every
        # create or change request carries an Idempotency-Key (see docs/API.md).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
