# Smart Campus platform: PostgreSQL + two Flask backends + Nginx load balancer.
# Start with:  docker compose up -d --build
name: smart-campus

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data              # named volume: data survives container restarts
      - ./db/init:/docker-entrypoint-initdb.d:ro     # schema and seed run once, on an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [campus]

  backend1:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INSTANCE_NAME: backend-1
      SIMULATE_TRACKER_OUTAGE: ${SIMULATE_TRACKER_OUTAGE:-false}
      BOOKING_MAX_HOURS: ${BOOKING_MAX_HOURS:-8}
      TEMPERATURE_THRESHOLD_C: ${TEMPERATURE_THRESHOLD_C:-30}
      SMOKE_THRESHOLD: ${SMOKE_THRESHOLD:-0.5}
    depends_on:
      db:
        condition: service_healthy
    networks: [campus]

  backend2:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      INSTANCE_NAME: backend-2
      SIMULATE_TRACKER_OUTAGE: ${SIMULATE_TRACKER_OUTAGE:-false}
      BOOKING_MAX_HOURS: ${BOOKING_MAX_HOURS:-8}
      TEMPERATURE_THRESHOLD_C: ${TEMPERATURE_THRESHOLD_C:-30}
      SMOKE_THRESHOLD: ${SMOKE_THRESHOLD:-0.5}
    depends_on:
      db:
        condition: service_healthy
    networks: [campus]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2
    networks: [campus]

volumes:
  pgdata:

networks:
  campus:
